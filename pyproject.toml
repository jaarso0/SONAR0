[project]
name = "sonar"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    # worker
    "livekit-agents[sarvam,silero,turn-detector]~=1.6",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "numpy>=1.26",
    # pipeline
    "groq>=0.11",
    "trafilatura>=1.12",
    "pymupdf4llm>=0.0.17",
    "langchain-text-splitters>=0.3",
    "fastembed>=0.4",
    "httpx>=0.27",
    # api
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "livekit-agents[sarvam,silero,turn-detector,openai]~=1.6",
]

[dependency-groups]
dev = ["ruff", "pytest"]
